# CryptBudding Simulation Parameters — SetDefaults() Reference
#
# This file mirrors the compiled-in defaults from CryptBuddingParams::SetDefaults().
# It serves as a template — copy it and modify for your experiment.
#
# Usage:
#   ./CryptBuddingApp -model node2d -config my_params.ini
#   ./CryptBuddingApp -model vertex2d -config my_params.ini -saveconfig saved.ini
#
# NOTE: Values marked "auto" are derived in Finalise() from other parameters.
#       Setting them explicitly in your INI prevents the auto-derivation.
#
# Last synced with CryptBuddingParams.hpp: 2026-03-06

# ══════════════════════════════════════════════════════════════
#  SIMULATION
# ══════════════════════════════════════════════════════════════

[Simulation]
# modelType = node2d                      # Set via -model flag
endTime = 168.0                            # Total simulation time (hours). Auto-tuned per model if omitted.
dt = 0.005                                 # Time step. Auto-tuned per model if omitted.
dtGrow = 0.002                             # Growth phase dt (vertex3d only)
relaxationTime = 10.0                      # Relaxation phase duration (hours)
runNumber = 0

# ══════════════════════════════════════════════════════════════
#  FEATURE TOGGLES
# ══════════════════════════════════════════════════════════════

[Features]
enableLumenPressure = true                 # LumenPressureForce
enableApicalConstriction = true            # ApicalConstrictionForce (vertex models)
enableEcmGuidance = false                  # DynamicECMContactGuidanceForce (3D only)
enableRelaxation = true                    # Pauses proliferation during equilibration
enableSloughing = true                     # PlaneBasedCellKiller
enableDifferentialAdhesion = true          # DifferentialAdhesionForce (vertex models)
enableNonNeighbourCellRepulsion = true     # NonNeighbourCellRepulsionForce (vertex2d)
enableCurvatureBending = true              # RingSmoothingForce (node2d) / SurfaceSmoothingForce (node3d)
enableCellPolarity = true                  # CellPolarityForce
enableEcmConfinement = true               # ECMConfinementForce + DynamicECMField
enableLumenHole = true                     # Clear ECM inside organoid (central lumen)
enableContinuousPvd = false                # ContinuousPvdModifier (live ParaView preview)
useTopologyBasedSprings = true             # RingSpringForce (true) vs GeneralisedLinearSpringForce (false)

# ══════════════════════════════════════════════════════════════
#  GEOMETRY
# ══════════════════════════════════════════════════════════════

[Geometry2D]
organoidRadius2d = 8.0
numCells2dNode = 80
numCells2dVertex = 40
innerRadius2d = 6.0
outerRadius2d = 8.0
interactionCutoff2d = 2.5
# t1Threshold2d = auto                    # Derived from ecmConfinementStiffness in Finalise()
t2Threshold2d = 0.05

[Geometry3D]
numCells3dNode = 100
numCells3dVertex = 200
organoidRadius3d = 10.0
shellThickness3d = 3.0
interactionCutoff3d = 8.0
# sphereRadius3dVertex = auto             # Derived from organoidRadius3d
bmOffset3dVertex = 1.0

# ══════════════════════════════════════════════════════════════
#  FORCES
# ══════════════════════════════════════════════════════════════

[SpringForce]
springStiffness = 30.0
springCutoff = 1.5
springStiffnessTAScale = 1.0               # TA spring stiffness multiplier (relative to stem)
springStiffnessDiffScale = 1.0             # Differentiated/Paneth spring stiffness multiplier

[DifferentialAdhesionForce]
apicalApicalAdhesion = 1.2
basalBasalAdhesion = 1.0
apicalBasalAdhesion = 0.5

[LumenPressureForce]
lumenPressure = 2.0
lumenUseTargetVolume = false               # false = constant pressure, true = growing fluid volume
lumenVolumeGrowthRate = 0.05               # Volume growth rate (fraction/hour)
lumenBulkModulus = 10.0                    # Fluid stiffness (pressure increase when compressed)

[ApicalConstrictionForce]
apicalConstrictionStrength = 3.0

[RingSmoothingForce]
bendingStiffness = 5.0
gammaStemScale = 0.7                       # Stem cells are softer
gammaTransitScale = 1.0
gammaDiffScale = 1.3                       # Paneth/differentiated are stiffer

[ECMConfinementForce]
ecmStiffness = 5.0                         # Legacy BM stiffness; fallback if ecmConfinementStiffness not set
# ecmConfinementStiffness = auto           # Falls back to ecmStiffness if not set
ecmSpringRestLength = 0.0                  # Rest length for cell-ECM springs (0 = adhesion)
ecmInteractionCutoff = 1.5                 # Cutoff distance for cell-ECM interactions
bmRadiusFraction = 1.25                    # BM radius as fraction of organoidRadius
ecmMaxRadiusFraction = 4.0                 # ECM boundary as fraction of organoidRadius
ecmGridSpacing = 10.0                      # ECM grid voxel size
ecmGridType = square                       # Grid layout: "square" or "hex"
ecmDegradationRate = 0.02                  # ECM density loss per cell per unit time
ecmDiffusionCoeff = 0.1                    # Density smoothing coefficient

[CellPolarityForce]
polarityBendingStrength = 0.3
polarityAlignmentStrength = 0.1

[ECMGuidanceForce]
# ecmDomainHalf = auto                    # Derived in Finalise()
ecmBaseSpeed = 0.3

# ══════════════════════════════════════════════════════════════
#  VERTEX MODEL (Nagai-Honda parameters)
# ══════════════════════════════════════════════════════════════

[VertexModel]
nhMembraneSurface = 10.0
nhCellCellAdhesion = 1.0
nhBoundaryAdhesion = 2.0
nonNeighbourRepulsionStiffness = 25.0      # Non-neighbour centre-centre repulsion strength
nonNeighbourRepulsionCutoff = 1.1          # Repulsion distance threshold

# Per-cell-type adhesion (uniform by default)
nhStemStemAdhesion = 1.0
nhStemTransitAdhesion = 1.0
nhStemDiffAdhesion = 1.0
nhTransitTransitAdhesion = 1.0
nhTransitDiffAdhesion = 1.0
nhDiffDiffAdhesion = 1.0
nhStemBoundaryAdhesion = 2.0
nhTransitBoundaryAdhesion = 2.0
nhDiffBoundaryAdhesion = 2.0

# Surface tension
gammaApical = 0.85
gammaBasal = 0.85
gammaLateral = 0.7
gammaStemScale = 0.7
gammaTransitScale = 1.0
gammaDiffScale = 1.3

# ══════════════════════════════════════════════════════════════
#  CELL TYPES & CYCLE
# ══════════════════════════════════════════════════════════════

[CellTypes]
stemFraction = 0.2
transitFraction = 0.5

[CellCycle]
quiescentFraction = 0.7                   # Contact inhibition threshold (V_curr/V_eq)
sloughRadiusFactor = 5.0                  # Sloughing boundary = radius × factor
stemCycleMin = 12.0                       # Min total cell cycle (hours)
stemCycleMax = 14.0                       # Max total cell cycle (hours)
taCycleRatio = 0.5                        # TA cycle = ratio × stem cycle

# Stochastic 4-cell-type transitions (Montes-Olivas et al. 2023) — default cell cycle model
enableStochasticFourType = true

# Generational cascade (Meineke et al. 2001) — legacy; disabled when using 4-type model
enableGenerationalCascade = false
maxTransitGenerations = 3
probStemToStem = 0.89
probStemToPaneth = 0.09
probTaToTaEarly = 0.9
probTaToTaLate = 0.7
transitionTime = 120.0
panethFraction = 0.09

# ══════════════════════════════════════════════════════════════
#  GHOST NODE ECM (off-lattice particle-based ECM)
# ══════════════════════════════════════════════════════════════

[GhostNodeECM]
enableGhostNodeECM = true                 # Default: use ghost node ECM (set false for grid-based)
enableViscoelasticECM = true              # Default: SLS constitutive model (set false for elastic)
ghostGhostStiffness = 5.0                 # ECM-ECM spring stiffness (overridden by ecmStiffness in Finalise)
ghostCellGhostStiffness = 5.0             # Cell-ECM spring stiffness (overridden by ecmStiffness in Finalise)
ghostDamping = 5.0                        # ECM node viscous damping coefficient
ghostRemovalThreshold = 0.05              # Density below which ghost nodes are removed
ghostFibreRemodelingRate = 0.1            # Fibre reorientation rate (h⁻¹)
ghostAnisotropyStrength = 0.5             # Fibre anisotropy factor [0=isotropic, 1=fully aligned]
ghostCellGhostRestLength = 0.0            # Cell-ECM spring rest length
ghostCellGhostCutoff = 1.5               # Cell-ECM interaction cutoff (CD)
ghostSpringRestLength = -1.0              # ECM-ECM spring rest length (-1 = auto from grid spacing)
ghostGridSpacing = -1.0                   # Ghost node grid spacing (-1 = auto from ecmGridSpacing)
ghostRemovalCheckInterval = 100           # Steps between removal checks
# Generalised Maxwell model: E(t) = E0 + E1*exp(-t/tau)
ghostRelaxedStiffness = 5.0               # E0: long-time (relaxed) modulus (force/CD)
ghostRelaxationModulus = 1.0              # E1: transient modulus (force/CD)
ghostRelaxationTime = 1.0                 # tau: relaxation time (hours)
