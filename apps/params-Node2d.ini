# CryptBudding Simulation Parameters (Node2D)

# ══════════════════════════════════════════════════════════════
#  SIMULATION
# ══════════════════════════════════════════════════════════════

[Simulation]
modelType = node2d
endTime = 48                              # AUTOTUNING: if not set, Finalise() uses 168.0 for most models
dt = 0.005                                  # AUTOTUNING: if not set, Finalise() picks by model type:
                                           #   node2d=0.005, vertex2d=0.0002–0.0005 (stiffness-dependent),
                                           #   node3d=0.01, vertex3d=0.0001.  Setting dt here prevents override.
dtGrow = 0.005
relaxationTime = 10
runNumber = 2

# ══════════════════════════════════════════════════════════════
#  FEATURE TOGGLES
# ══════════════════════════════════════════════════════════════

[Features]
enableLumenPressure = true                 # LumenPressureForce
enableApicalConstriction = false           # ApicalConstrictionForce (Vertex models only)
enableEcmGuidance = false                  # DynamicECMContactGuidanceForce (3D only, enables ECM remodeling)
enableRelaxation = false                   # No force - pauses proliferation
enableSloughing = false                     # PlaneBasedCellKiller (via AddBoundingBoxKillers)
enableDifferentialAdhesion = false         # DifferentialAdhesionForce (Vertex models only)
enableCurvatureBending = true              # RingSmoothingForce (node2d) or CurvatureBendingForce (node3d)
enableCellPolarity = false                 # CellPolarityForce
enableEcmConfinement = true                # ECMConfinementForce + DynamicECMField
enableLumenHole = true                     # Clear ECM inside organoid (creates central lumen)
enableContinuousPvd = false                # ContinuousPvdModifier (live ParaView previews)
useTopologyBasedSprings = false            # RingSpringForce (true) vs GeneralisedLinearSpringForce (false)

# ══════════════════════════════════════════════════════════════
#  GEOMETRY
# ══════════════════════════════════════════════════════════════

[Geometry2D]
numCells2dNode = 18           # NODE-2D: cells on ring → R = N/(2π) ≈ 4.77, spacing = 1.0
numCells2dVertex = 18         # VERTEX-2D: annulus cells → auto-derives innerRadius2d, outerRadius2d
interactionCutoff2d = 1.5    # NODE-2D: neighbour cutoff (must be > spacing)
t1Threshold2d = 0.15          # VERTEX-2D only. AUTOTUNING: if not set, Finalise() uses 0.2 (k<2) or 0.15 (k≥2)
t2Threshold2d = 0.05          # VERTEX-2D only. AUTOTUNING: if not set, Finalise() defaults to 0.05

# ══════════════════════════════════════════════════════════════
#  FORCES
# ══════════════════════════════════════════════════════════════

# --- Spring Force (RingSpringForce / GeneralisedLinearSpringForce) ---
# Classes: RingSpringForce, GeneralisedLinearSpringForce, DifferentialAdhesionForce
[SpringForce]
springStiffness = 15
springCutoff = 1.5
# Per-cell-type stiffness multipliers (relative to stem = 1.0).
# Effective pair stiffness = springStiffness * sqrt(scaleA * scaleB).
springStiffnessTAScale = 3.0
springStiffnessDiffScale = 5.0

# --- Lumen Pressure Force ---
# Class: LumenPressureForce
[LumenPressureForce]
lumenUseTargetVolume = true  # true = incompressible fluid with growing volume
lumenVolumeGrowthRate = 0.01  # Volume growth rate (fraction per hour, 0.05 = 5%/h)
lumenBulkModulus = 30.0       # Fluid stiffness (how much pressure increases when compressed)

# --- Ring Smoothing / Curvature Bending Force ---
# Class: RingSmoothingForce (node2d), CurvatureBendingForce (node3d), SurfaceSmoothingForce (node3d)
[RingSmoothingForce]
bendingStiffness = 20
gammaStemScale = 0.7          # Stem cells are softer
gammaTransitScale = 1
gammaDiffScale = 1.3          # Paneth/differentiated are stiffer

# --- ECM Confinement Force ---
# Class: ECMConfinementForce + DynamicECMField
# Each ECM grid element acts as an agent connected to nearby cells via linear springs.
# Force: F = k × ρ × (d − s₀) × d̂   (density-weighted linear spring, no exponential)
[ECMConfinementForce]
ecmConfinementStiffness = 50 # Spring stiffness for cell-ECM agent interactions (primary param for 2D+3D)
ecmSpringRestLength = 0.0     # Rest length for cell-ECM springs (0 = adhesion to ECM position)
ecmInteractionCutoff = 2      # Cutoff distance for cell-ECM spring interactions
ecmMaxRadiusFraction = 10.0    # ECM boundary as fraction of organoidRadius
ecmGridSpacing = 1          # ECM grid voxel size (should be ~ cell spacing)
ecmGridType = hex             # Grid layout: "square" or "hex"
ecmDegradationRate = 0.05      # ECM density loss per cell per unit time
ecmDiffusionCoeff = 0.0      # Density smoothing coefficient (set 0 to disable diffusion entirely)

; # --- Cell Polarity Force ---
; # Class: CellPolarityForce
; [CellPolarityForce]
; polarityBendingStrength = 25
; polarityAlignmentStrength = 0.3

# ══════════════════════════════════════════════════════════════
#  CELL TYPES & CYCLE
# ══════════════════════════════════════════════════════════════

# Classes: UniformContactInhibitionCellCycleModel, UniformContactInhibitionGenerationalCellCycleModel
[CellTypes]
stemFraction = 0.42           # As in Sandra's CC-B-Ic model
transitFraction = 0.49

[CellCycle]
quiescentFraction = 0.7
sloughRadiusFactor = 5        # Used by PlaneBasedCellKiller
stemCycleMin = 12.0           # Uniform random cell cycle duration (hours)
stemCycleMax = 14.0
taCycleRatio = 1.0            # TA cycle = ratio × stem cycle

# Generational cascade (Meineke et al. 2001)
# Class: UniformContactInhibitionGenerationalCellCycleModel
enableGenerationalCascade = true
maxTransitGenerations = 3     # TA cells differentiate after this many divisions
