# CryptBudding Simulation Parameters (Vertex2D)

# ══════════════════════════════════════════════════════════════
#  SIMULATION
# ══════════════════════════════════════════════════════════════

[Simulation]
modelType = vertex2d
endTime = 168                              # AUTOTUNING: if not set, Finalise() uses 168.0 for most models
dt = 0.005                                 # AUTOTUNING: if not set, Finalise() picks by model type:
                                           #   vertex2d=0.0002–0.0005 (stiffness-dependent), vertex3d=0.0001.
                                           #   Setting dt here prevents override.
dtGrow = 0.005
relaxationTime = 10
runNumber = 1

# ══════════════════════════════════════════════════════════════
#  FEATURE TOGGLES
# ══════════════════════════════════════════════════════════════

[Features]
enableLumenPressure = true                 # LumenPressureForce
enableApicalConstriction = false           # ApicalConstrictionForce
enableEcmGuidance = false                  # DynamicECMContactGuidanceForce (3D only, enables ECM remodeling)
enableRelaxation = false                   # No force - pauses proliferation
enableSloughing = false                    # PlaneBasedCellKiller (via AddBoundingBoxKillers)
enableDifferentialAdhesion = false         # DifferentialAdhesionForce
enableCurvatureBending = false             # RingSmoothingForce (node2d) or CurvatureBendingForce (node3d) - Node models only
enableCellPolarity = false                 # CellPolarityForce - Node models only
enableEcmConfinement = true                # ECMConfinementForce + DynamicECMField
enableContinuousPvd = false                # ContinuousPvdModifier (live ParaView previews)
useTopologyBasedSprings = false            # RingSpringForce (true) vs GeneralisedLinearSpringForce (false) - Node models only

# ══════════════════════════════════════════════════════════════
#  GEOMETRY
# ══════════════════════════════════════════════════════════════

[Geometry2D]
numCells2dVertex = 12         # VERTEX-2D: fewer cells = more stable
t1Threshold2d = 0.05          # AUTOTUNING: if not set, Finalise() uses 0.2 (k<2) or 0.15 (k≥2)
t2Threshold2d = 0.01          # AUTOTUNING: if not set, Finalise() defaults to 0.05

# ══════════════════════════════════════════════════════════════
#  FORCES
# ══════════════════════════════════════════════════════════════

# --- Spring Force (RingSpringForce / GeneralisedLinearSpringForce) ---
# Classes: RingSpringForce, GeneralisedLinearSpringForce (Node models only)
[SpringForce]
springStiffness = 5
springCutoff = 1.5

# --- Differential Adhesion Force ---
# Class: DifferentialAdhesionForce
[DifferentialAdhesionForce]
apicalApicalAdhesion = 1.2
basalBasalAdhesion = 1
apicalBasalAdhesion = 0.5

# --- Lumen Pressure Force ---
# Class: LumenPressureForce
[LumenPressureForce]
lumenPressure = 1.0          # Pressure (constant mode) or base pressure (target volume mode)
lumenUseTargetVolume = true  # true = incompressible fluid with growing volume
lumenVolumeGrowthRate = 0.05 # Volume growth rate (fraction per hour, 0.05 = 5%/h)
lumenBulkModulus = 500.0      # Fluid stiffness (how much pressure increases when compressed)

# --- Apical Constriction Force ---
# Class: ApicalConstrictionForce
[ApicalConstrictionForce]
apicalConstrictionStrength = 2

# --- ECM Confinement Force ---
# Class: ECMConfinementForce + DynamicECMField
# Each ECM grid element acts as an agent connected to nearby cells via linear springs.
# Force: F = k × ρ × (d − s₀) × d̂   (density-weighted linear spring, no exponential)
[ECMConfinementForce]
ecmStiffness = 3.0            # Legacy: only used by BasementMembraneForce in 3D models.
                              #   Also used as fallback if ecmConfinementStiffness is not set.
ecmConfinementStiffness = 3.0 # Spring stiffness for cell-ECM agent interactions (primary param for 2D+3D)
ecmSpringRestLength = 0.0     # Rest length for cell-ECM springs (0 = adhesion to ECM position)
ecmInteractionCutoff = 1.5    # Cutoff distance for cell-ECM spring interactions
bmRadiusFraction = 1.25       # BM target radius as fraction of organoidRadius
ecmMaxRadiusFraction = 5.0    # ECM boundary as fraction of organoidRadius
ecmGridSpacing = 0.5          # ECM grid voxel size (should be ~ cell spacing)
ecmGridType = hex             # Grid layout: "square" or "hex"
ecmDegradationRate = 0.5      # ECM density loss per cell per unit time
ecmDiffusionCoeff = 0.1       # Density smoothing coefficient (prevents sharp gradients)

# --- ECM Contact Guidance Force (3D only) ---
# Class: DynamicECMContactGuidanceForce
[ECMGuidanceForce]
ecmBaseSpeed = 0.3            # Base cell migration speed (if guidance enabled)

# ══════════════════════════════════════════════════════════════
#  VERTEX MODEL (Nagai-Honda parameters)
# ══════════════════════════════════════════════════════════════

# Class: FastNagaiHondaForce
[VertexModel]
# When Differentail Ahesion is disabled
nhBoundaryAdhesion = 30.0
nhMembraneSurface = 10.0          # Standard value
nhCellCellAdhesion = 12.0         # Standard: adhesion > membrane


# Scale factor 2x on original differential values:
nhStemStemAdhesion = 12.0
nhStemTransitAdhesion = 12.0
nhStemDiffAdhesion = 12.0
nhTransitTransitAdhesion = 12.0
nhTransitDiffAdhesion = 12.0
nhDiffDiffAdhesion = 12.0


# Per-cell-type adhesion (used when enableDifferentialAdhesion = true)
nhStemBoundaryAdhesion = 1.5
nhTransitBoundaryAdhesion = 1.5
nhDiffBoundaryAdhesion = 6.0   # Paneth cells adhere more strongly to boundary
gammaApical = 0.85
gammaBasal = 0.85
gammaLateral = 0.7
gammaStemScale = 0.7          # Stem cells are softer
gammaTransitScale = 1.0
gammaDiffScale = 1.3          # Paneth/differentiated are stiffer

# ══════════════════════════════════════════════════════════════
#  CELL TYPES & CYCLE
# ══════════════════════════════════════════════════════════════

# Classes: UniformContactInhibitionCellCycleModel, UniformContactInhibitionGenerationalCellCycleModel
[CellTypes]
stemFraction = 0.42           # As in Sandra's CC-B-Ic model
transitFraction = 0.49

[CellCycle]
quiescentFraction = 0.5
sloughRadiusFactor = 5        # Used by PlaneBasedCellKiller
stemCycleMin = 12.0
stemCycleMax = 14.0
taCycleRatio = 1.0            # TA cycle = ratio × stem cycle

# Generational cascade (Meineke et al. 2001)
# Class: UniformContactInhibitionGenerationalCellCycleModel
enableGenerationalCascade = true
maxTransitGenerations = 3     # TA cells differentiate after this many divisions
